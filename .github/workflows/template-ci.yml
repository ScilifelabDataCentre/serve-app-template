name: Template CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install template test tools
        run: python -m pip install --upgrade "copier>=9.3,<10" jinja2 pyyaml pytest
      - name: Static and render tests
        run: |
          python -m pytest -q
          python tests/render_smoke.py
      - name: Real Copier generation tests
        run: python tests/copier_smoke.py
